<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servicios</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Gestión de servicios</h1>
    <nav><a href="index.html">Inicio</a><a href="clientes.html">Clientes</a><a href="reservas.html">Reservas</a></nav>
  </header>
  <main>
    <form id="form-servicio">
      <input name="nombre" placeholder="Nombre del servicio" required>
      <input name="precio" type="number" min="0" step="0.10" placeholder="Precio (S/)" required>
      <input name="duracion" type="number" min="5" step="5" placeholder="Duración (minutos)" required>
      <button type="submit">Registrar servicio</button>
    </form>
    <input id="buscar" placeholder="Buscar servicio">
    <table>
      <thead><tr><th>ID</th><th>Servicio</th><th>Precio (S/)</th><th>Duración (min)</th></tr></thead>
      <tbody id="tabla-servicios"></tbody>
    </table>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/servicios.js"></script>
</body>
</html>
